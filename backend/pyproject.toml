[project]
name = "pfi-backend"
version = "0.1.0"
description = "Backend del PFI: API REST, worker de procesamiento y adaptadores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "celery>=5.4",
    "ezkl>=23.0.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "web3>=7.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

# La aplicación no se instala como paquete; pytest importa app/ desde la raíz.
[tool.pytest.ini_options]
pythonpath = ["."]
